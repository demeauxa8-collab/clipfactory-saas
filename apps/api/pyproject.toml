[project]
name = "clipfactory-api"
version = "0.1.0"
description = "ClipFactory SaaS — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "asyncpg>=0.30.0",
  "redis>=5.2.0",
  "httpx>=0.27.0",
  "pyjwt[crypto]>=2.10.0",
  "stripe>=11.4.0",
  "boto3>=1.35.0",
  "structlog>=24.4.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7.0",
  "black>=24.10.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B008"]   # FastAPI Depends() pattern

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
