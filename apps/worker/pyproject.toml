[project]
name = "clipfactory-worker"
version = "0.1.0"
description = "ClipFactory SaaS — clipping worker"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.6.0",
  "asyncpg>=0.30.0",
  "redis>=5.2.0",
  "httpx>=0.27.0",
  "boto3>=1.35.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "structlog>=24.4.0",
  "yt-dlp>=2024.11.18",
  "openai>=1.54.0",
  "anthropic>=0.40.0",
  "Pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7.0",
  "black>=24.10.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
