name: Supabase keepalive

# Supabase pauses free-tier projects after ~7 days without activity. A paused
# project made every page 504 (the middleware could not reach auth), so we keep
# the database warm with a cheap authenticated read every three days.

on:
  schedule:
    - cron: "17 4 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Query Postgres through PostgREST
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Missing NEXT_PUBLIC_SUPABASE_URL or NEXT_PUBLIC_SUPABASE_ANON_KEY secret."
            exit 1
          fi

          # plan_definitions is world-readable under RLS, so this reaches
          # Postgres itself — a gateway-only hit would not count as activity.
          # select=* keeps the ping working through column renames.
          status=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 30 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/plan_definitions?select=*&limit=1")

          echo "HTTP ${status}"
          cat /tmp/body

          if [ "${status}" != "200" ]; then
            echo "::error::Supabase keepalive failed with HTTP ${status}"
            exit 1
          fi
